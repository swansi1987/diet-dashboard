// ── SVG Chart Primitives ────────────────────────────────────────────────────
function SVGDonut({data,size=160}) {
  const cx=size/2,cy=size/2,OR=size/2-14,IR=size/2-32;
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const toRad=a=>a*Math.PI/180;
  let angle=-90;
  const slices=data.map(d=>{const deg=(d.value/total)*356;const s={...d,sa:angle,ea:angle+deg};angle+=deg+1.5;return s;});
  const arc=(sa,ea,r)=>{const x1=cx+r*Math.cos(toRad(sa)),y1=cy+r*Math.sin(toRad(sa)),x2=cx+r*Math.cos(toRad(ea)),y2=cy+r*Math.sin(toRad(ea));return `M${x1},${y1} A${r},${r} 0 ${ea-sa>180?1:0} 1 ${x2},${y2}`;};
  return <div>
    <div className="flex justify-center">
      <svg width={size} height={size}>
        {slices.map((s,i)=>{
          const oa=arc(s.sa,s.ea,OR);
          const ix1=cx+IR*Math.cos(toRad(s.ea)),iy1=cy+IR*Math.sin(toRad(s.ea));
          const ix2=cx+IR*Math.cos(toRad(s.sa)),iy2=cy+IR*Math.sin(toRad(s.sa));
          return <path key={i} d={`${oa} L${ix1},${iy1} A${IR},${IR} 0 ${s.ea-s.sa>180?1:0} 0 ${ix2},${iy2} Z`} fill={s.color} opacity={0.88}/>;
        })}
      </svg>
    </div>
    <div className="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-2">
      {data.map((d,i)=><div key={i} className="flex items-center gap-1.5 text-xs text-slate-400"><div className="w-2 h-2 rounded-full" style={{background:d.color}}/>{d.name}: {d.value}g</div>)}
    </div>
  </div>;
}

function SVGBars({data,dataKey,color='#10b981',height=180,showLabel=true}) {
  const W=320,H=height,P={t:10,r:8,b:28,l:38};
  const vals=data.map(d=>d[dataKey]),max=Math.max(...vals,1);
  const cW=W-P.l-P.r,cH=H-P.t-P.b,bW=Math.min(cW/data.length*0.6,34),gap=cW/data.length;
  const ticks=[0,25,50,75,100];
  return <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
    {ticks.map(p=>{const y=P.t+cH*(1-p/100);return <g key={p}><line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke="#1e293b" strokeWidth={p===0?1:0.5} strokeDasharray={p>0?"3,3":""}/><text x={P.l-4} y={y+3} textAnchor="end" fill="#475569" fontSize={8}>{Math.round(max*p/100)}</text></g>;})}
    {data.map((d,i)=>{const x=P.l+gap*(i+0.5)-bW/2,bH=cH*(d[dataKey]/max),y=P.t+cH-bH;return <g key={i}><rect x={x} y={y} width={bW} height={bH} rx={3} fill={typeof color==='function'?color(d,i):color} opacity={0.85}/>{showLabel&&<text x={x+bW/2} y={H-P.b+12} textAnchor="middle" fill="#64748b" fontSize={9}>{d.date||d.name}</text>}</g>;})}
  </svg>;
}

function SVGColorBars({data,height=180}) {
  const W=320,H=height,P={t:14,r:8,b:28,l:38},max=115;
  const cW=W-P.l-P.r,cH=H-P.t-P.b,bW=Math.min(cW/data.length*0.6,36),gap=cW/data.length;
  return <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
    {[0,50,100].map(p=>{const y=P.t+cH*(1-p/max);return <g key={p}><line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke={p===100?"#334155":"#1e293b"} strokeWidth={0.5} strokeDasharray={p>0?"3,3":""}/><text x={P.l-4} y={y+3} textAnchor="end" fill="#475569" fontSize={8}>{p}%</text></g>;})}
    {data.map((d,i)=>{const x=P.l+gap*(i+0.5)-bW/2,pct=Math.min(d.percent,max),bH=cH*(pct/max),y=P.t+cH-bH;return <g key={i}><rect x={x} y={y} width={bW} height={bH} rx={3} fill={d.color} opacity={0.85}/><text x={x+bW/2} y={H-P.b+12} textAnchor="middle" fill="#64748b" fontSize={9}>{d.name}</text><text x={x+bW/2} y={Math.max(y-3,P.t+8)} textAnchor="middle" fill={d.color} fontSize={8} fontWeight="600">{d.percent}%</text></g>;})}
  </svg>;
}

function SVGLine({data,lines,height=180,dateKey='date'}) {
  const W=320,H=height,P={t:10,r:10,b:28,l:40};
  const allVals=lines.flatMap(l=>data.map(d=>+d[l.key]));
  const mx=Math.max(...allVals),mn=Math.min(...allVals)*0.97,range=mx-mn||1;
  const cW=W-P.l-P.r,cH=H-P.t-P.b;
  const px=i=>P.l+cW*i/(data.length-1||1);
  const py=v=>P.t+cH*(1-(v-mn)/range);
  const ticks=5;
  return <svg viewBox={`0 0 ${W} ${H}`} className="w-full">
    {Array.from({length:ticks},(_,i)=>{const v=mn+range*i/(ticks-1),y=py(v);return <g key={i}><line x1={P.l} y1={y} x2={W-P.r} y2={y} stroke="#1e293b" strokeWidth={0.5} strokeDasharray="3,3"/><text x={P.l-4} y={y+3} textAnchor="end" fill="#475569" fontSize={8}>{Number.isInteger(v)?v:v.toFixed(1)}</text></g>;})}
    {data.map((d,i)=>{if(i%Math.ceil(data.length/7)!==0&&i!==data.length-1)return null;return <text key={i} x={px(i)} y={H-P.b+11} textAnchor="middle" fill="#64748b" fontSize={9}>{d[dateKey]}</text>;})}
    {lines.map(l=>{
      const pts=data.map((d,i)=>`${px(i)},${py(d[l.key])}`).join(' ');
      return <g key={l.key}><polyline points={pts} fill="none" stroke={l.color} strokeWidth={2} strokeLinejoin="round" strokeLinecap="round"/>
        {data.map((d,i)=><circle key={i} cx={px(i)} cy={py(d[l.key])} r={3} fill={l.color}/>)}
      </g>;
    })}
    {lines.length>1&&<g transform={`translate(${P.l},${P.t})`}>
      {lines.map((l,i)=><g key={l.key} transform={`translate(${i*70},0)`}><rect width={8} height={3} y={-1} rx={1} fill={l.color}/><text x={11} y={3} fill="#94a3b8" fontSize={9}>{l.name}</text></g>)}
    </g>}
  </svg>;
}

function calcTotals(logs) {
  const c = logs.filter(l=>l.consumed);
  const sum = (k) => +c.reduce((s,l)=>s+(+l[k]||0),0).toFixed(1);
  return { calories:Math.round(sum('calories')), protein:sum('protein'), carbs:sum('carbs'), fats:sum('fats'),
           calcium:sum('calcium'), iron:sum('iron'), magnesium:sum('magnesium'), potassium:sum('potassium'), zinc:sum('zinc') };
}

// ── Shared Components ──────────────────────────────────────────────────────
function GlassCard({children,className='',onClick}) {
  return <div onClick={onClick} className={`bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl ${onClick?'cursor-pointer hover:border-slate-600':''} transition-all ${className}`}>{children}</div>;
}

function GradientButton({children,onClick,disabled,variant='primary',size='md',className=''}) {
  const v = {primary:'bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 text-white',
              ghost:'bg-slate-700/50 hover:bg-slate-600/50 text-slate-200 border border-slate-600',
              danger:'bg-gradient-to-r from-red-500 to-rose-500 text-white'};
  const s = {sm:'px-3 py-1.5 text-xs',md:'px-4 py-2 text-sm',lg:'px-6 py-3 text-base'};
  return <button onClick={onClick} disabled={disabled}
    className={`${v[variant]||v.primary} ${s[size]||s.md} rounded-xl font-medium transition-all duration-200 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:hover:scale-100 inline-flex items-center gap-1.5 ${className}`}>
    {children}
  </button>;
}

function Modal({isOpen,onClose,title,children,size='md'}) {
  if (!isOpen) return null;
  const sizes = {sm:'max-w-sm',md:'max-w-lg',lg:'max-w-2xl'};
  return <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose}/>
    <div className={`relative w-full ${sizes[size]||sizes.md} bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl fade-in overflow-hidden`}>
      {title && <div className="flex items-center justify-between px-6 py-4 border-b border-slate-700">
        <h2 className="text-lg font-semibold text-slate-100">{title}</h2>

// ── Protein Gauge ─────────────────────────────────────────────────────────
function ProteinGauge({currentG, weightKg=80}) {
  const GOAL=1.6, MAX=3.2, size=180;
  const ratio=currentG/weightKg, percent=Math.min(ratio/MAX,1);
  const cx=size/2, cy=size/2, r=size/2-20;
  const toXY=(a,r)=>({x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)});
  const arc=(s,e,r)=>{const a=toXY(s,r),b=toXY(e,r);return `M${a.x},${a.y} A${r},${r} 0 ${e-s>180?1:0} 1 ${b.x},${b.y}`;};
  const sa=-210, ea=30, total=ea-sa, fillEnd=sa+total*percent;
  const color=ratio<GOAL?'#f59e0b':ratio<MAX?'#10b981':'#06b6d4';
  return <svg width={size} height={size*0.75} viewBox={`0 0 ${size} ${size}`} className="overflow-visible">
    <path d={arc(sa,ea,r)} fill="none" stroke="#1e293b" strokeWidth={16} strokeLinecap="round"/>
    {percent>0 && <path d={arc(sa,fillEnd,r)} fill="none" stroke={color} strokeWidth={16} strokeLinecap="round"/>}
    <text x={cx} y={cy-8} textAnchor="middle" fill={color} fontSize={28} fontWeight="bold">{ratio.toFixed(1)}</text>
    <text x={cx} y={cy+14} textAnchor="middle" fill="#64748b" fontSize={11}>g/kg body weight</text>
    <text x={cx} y={cy+30} textAnchor="middle" fill="#475569" fontSize={10}>Goal: {GOAL} g/kg</text>
  </svg>;
}

        <div><label className="block text-xs text-slate-400 mb-1">From</label><input type="date" defaultValue="2026-03-19" className="bg-slate-700/50 border border-slate-600 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50"/></div>
        <div><label className="block text-xs text-slate-400 mb-1">To</label><input type="date" defaultValue="2026-03-25" className="bg-slate-700/50 border border-slate-600 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50"/></div>
      </div>
    </GlassCard>

    <GlassCard className="p-5">
      <div className="text-sm font-semibold text-slate-300 mb-4">Calories per Day</div>
      <SVGBars data={MOCK_REPORTS} dataKey="calories" color="#10b981" height={220}/>
    </GlassCard>

    <GlassCard className="p-5">
      <div className="text-sm font-semibold text-slate-300 mb-4">Macronutrients (g/day)</div>
      <SVGLine data={MOCK_REPORTS} lines={[{key:'protein',color:'#10b981',name:'Protein'},{key:'carbs',color:'#06b6d4',name:'Carbs'},{key:'fats',color:'#f59e0b',name:'Fats'}]} height={220}/>

// ── Weight Log View ───────────────────────────────────────────────────────
function WeightView() {
  const [entries,setEntries]=useState(MOCK_WEIGHT.map((e,i)=>({...e,id:i})));
  const [w,setW]=useState('');
  const latest=entries[entries.length-1]?.weight;
  const trend=entries.length>=2?entries[entries.length-1].weight-entries[entries.length-2].weight:null;
  return <div className="p-5 max-w-3xl mx-auto space-y-5 fade-in">
    <h1 className="text-2xl font-bold text-white">Weight Log</h1>
    <div className="grid grid-cols-3 gap-4">
      <GlassCard className="p-4"><div className="text-xs text-slate-400 mb-1">Current</div><div className="text-2xl font-bold text-emerald-400">{latest} <span className="text-sm">kg</span></div></GlassCard>
      <GlassCard className="p-4"><div className="text-xs text-slate-400 mb-1">Last Change</div><div className={`text-2xl font-bold flex items-center gap-1 ${trend<0?'text-emerald-400':trend>0?'text-red-400':'text-slate-400'}`}>{trend!==null&&(trend<0?<Icons.TrendingDown className="w-5 h-5"/>:<Icons.TrendingUp className="w-5 h-5"/>)}{trend!==null?(trend>0?'+':'')+trend.toFixed(1)+' kg':'—'}</div></GlassCard>
      <GlassCard className="p-4"><div className="text-xs text-slate-400 mb-1">Entries</div><div className="text-2xl font-bold text-cyan-400">{entries.length}</div></GlassCard>
    </div>
    <GlassCard className="p-5">
      <h2 className="text-base font-semibold text-slate-200 mb-3">Log Weight</h2>
      <div className="flex flex-wrap gap-3 items-end">
        <div><label className="block text-xs text-slate-400 mb-1">Date</label><input type="date" defaultValue="2026-03-26" className="bg-slate-700/50 border border-slate-600 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50"/></div>
        <div><label className="block text-xs text-slate-400 mb-1">Weight (kg)</label><input type="number" step="0.1" className="w-28 bg-slate-700/50 border border-slate-600 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50" placeholder="80.1" value={w} onChange={e=>setW(e.target.value)}/></div>
        <GradientButton onClick={()=>{if(w){setEntries(p=>[...p,{id:Date.now(),date:'Mar 26',weight:parseFloat(w)}]);setW('');}}} disabled={!w}>Log Weight</GradientButton>
      </div>
    </GlassCard>
    <GlassCard className="p-5">
      <h2 className="text-base font-semibold text-slate-200 mb-3">History</h2>
      <SVGLine data={entries} lines={[{key:'weight',color:'#10b981',name:'Weight'}]} height={220}/>
    </GlassCard>
  </div>;
}

// ── Settings View ─────────────────────────────────────────────────────────
function SettingsView() {
  const [prov,setProv]=useState('gemini');
  const [keys,setKeys]=useState({gemini:'',openai:'',claude:''});
  const [saved,setSaved]=useState({});
  const providers=[
    {id:'gemini',label:'Gemini',desc:'gemini-2.5-flash-preview-05-20',set:false},
    {id:'openai',label:'OpenAI',desc:'gpt-4o',set:false},
    {id:'claude',label:'Claude',desc:'claude-sonnet-4-6',set:true},
  ];
  const saveKey=(id)=>{setSaved(p=>({...p,[id]:true}));setTimeout(()=>setSaved(p=>({...p,[id]:false})),2500);};
  return <div className="p-5 max-w-2xl mx-auto space-y-5 fade-in">
    <h1 className="text-2xl font-bold text-white">Settings</h1>
    <GlassCard className="p-6 space-y-6">
      <div>
        <h2 className="text-base font-semibold text-slate-200 mb-1">AI Provider</h2>
        <p className="text-sm text-slate-400 mb-5">All AI calls are made server-side. Keys never reach the browser.</p>
        <div className="grid grid-cols-3 gap-3 mb-6">
          {providers.map(p=>(
            <button key={p.id} onClick={()=>setProv(p.id)} className={`flex flex-col gap-1 p-4 rounded-xl border transition-all text-left ${prov===p.id?'border-emerald-500/50 bg-emerald-900/20':'border-slate-700 hover:border-slate-600 bg-slate-800/30'}`}>
              <div className="flex items-center justify-between">
                <span className={`text-sm font-semibold ${prov===p.id?'text-emerald-300':'text-slate-300'}`}>{p.label}</span>
                {prov===p.id?<Icons.CheckCircle className="w-4 h-4 text-emerald-400"/>:<Icons.Circle className="w-4 h-4 text-slate-600"/>}
              </div>
              <span className="text-xs text-slate-500">{p.desc}</span>
              {p.set&&<span className="text-xs text-emerald-500">✓ Key configured</span>}
            </button>
          ))}
        </div>
        <div className="space-y-5">
          {providers.map(p=>(
            <div key={p.id} className="space-y-2">
              <label className="flex items-center gap-2 text-sm font-medium text-slate-300">
                {p.label} API Key
                {p.set&&<span className="text-xs text-emerald-400 flex items-center gap-1"><Icons.CheckCircle className="w-3 h-3"/>Set</span>}
              </label>
              <div className="flex gap-2">
                <input type="password" className="flex-1 bg-slate-700/50 border border-slate-600 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50" placeholder={p.set?'••••••••••••••••':'Paste your API key here'} value={keys[p.id]} onChange={e=>setKeys(prev=>({...prev,[p.id]:e.target.value}))}/>
                <GradientButton onClick={()=>saveKey(p.id)} disabled={!keys[p.id]}>{saved[p.id]?'✓ Saved':'Save'}</GradientButton>
              </div>
            </div>
          ))}
        </div>
      </div>
    </GlassCard>
  </div>;
}

// ── Meal Planner View ─────────────────────────────────────────────────────
const MOCK_PLAN=`## 🌅 Breakfast
- **Scrambled Eggs (3 eggs)** — 210 kcal | P: 18g, C: 2g, F: 14g
- **Whole Grain Toast (2 slices)** — 160 kcal | P: 6g, C: 30g, F: 2g
- **Orange Juice (200ml)** — 88 kcal

## ☀️ Lunch
- **Grilled Chicken Wrap** — 420 kcal | P: 38g, C: 42g, F: 10g
  - Whole wheat tortilla, chicken breast, mixed greens, avocado, Greek yogurt dressing
- **Side Salad** — 45 kcal | mixed greens, cucumber, cherry tomatoes

## 🌙 Dinner
- **Baked Cod with Lemon Herb Crust** — 280 kcal | P: 42g, C: 8g, F: 8g
- **Steamed Broccoli & Quinoa** — 230 kcal | P: 9g, C: 38g, F: 4g
- **Mixed Berry Smoothie** — 140 kcal

---
**Estimated Total: ~1,573 kcal | Protein: ~113g | Carbs: ~120g | Fats: ~38g**`;

function PlannerView() {
  const [plan,setPlan]=useState(null);
  const [loading,setLoading]=useState(false);
  const totals=calcTotals(MOCK_LOGS);
  const generate=()=>{setLoading(true);setTimeout(()=>{setPlan(MOCK_PLAN);setLoading(false);},2200);};
  const renderMD=(text)=>text.split('\n').map((line,i)=>{
    if(line.startsWith('## ')) return <h2 key={i} className="text-base font-bold text-emerald-400 mt-5 first:mt-0">{line.slice(3)}</h2>;
    if(line.startsWith('- **')) return <p key={i} className="pl-4 text-slate-300 leading-relaxed">{line.slice(2).replace(/\*\*/g,'')}</p>;
    if(line.startsWith('  - ')) return <p key={i} className="pl-8 text-slate-500 text-xs">{line.slice(4)}</p>;
    if(line.startsWith('- ')) return <p key={i} className="pl-4 text-slate-400">{line.slice(2)}</p>;
    if(line.startsWith('---')) return <hr key={i} className="border-slate-700 my-3"/>;
    if(line.startsWith('**')) return <p key={i} className="font-semibold text-slate-200 mt-2">{line.replace(/\*\*/g,'')}</p>;
    if(line.trim()==='') return <div key={i} className="h-1"/>;
    return <p key={i} className="text-slate-300">{line}</p>;
  });
  return <div className="p-5 max-w-2xl mx-auto space-y-5 fade-in">
    <div className="flex items-center justify-between">
      <h1 className="text-2xl font-bold text-white">AI Meal Planner</h1>
      <GradientButton onClick={generate} disabled={loading}>
        <Icons.Cpu className="w-4 h-4"/>{loading?'Generating...':'Generate Plan'}
      </GradientButton>
    </div>
    <GlassCard className="p-4">
      <p className="text-sm text-slate-400 mb-2">Context for plan generation:</p>
      <div className="flex flex-wrap gap-4 text-sm">
        <span className="text-slate-300">Today: <span className="text-emerald-400">{totals.calories} kcal</span></span>
        <span className="text-slate-300">Protein: <span className="text-cyan-400">{totals.protein}g</span></span>
        <span className="text-slate-300">Weight: <span className="text-cyan-400">80.1 kg</span></span>
        <span className="text-slate-300">Age: <span className="text-cyan-400">28</span></span>
      </div>
    </GlassCard>
    {loading&&<GlassCard className="p-12 flex flex-col items-center gap-4">
      <div className="w-12 h-12 border-2 border-slate-600 border-t-emerald-500 rounded-full spin"/>
      <p className="text-slate-400">Creating your personalized meal plan...</p>
    </GlassCard>}
    {plan&&!loading&&<GlassCard className="p-6"><div className="space-y-1 text-sm">{renderMD(plan)}</div></GlassCard>}
    {!plan&&!loading&&<GlassCard className="p-12 flex flex-col items-center gap-4 text-center">
      <Icons.Cpu className="w-12 h-12 text-slate-600"/>
      <div><p className="text-slate-400">Click "Generate Plan" to create a personalized next-day meal plan</p><p className="text-slate-600 text-sm mt-1">Uses your today's intake and profile as context</p></div>
    </GlassCard>}
  </div>;
}

// ── Simple placeholder views ───────────────────────────────────────────────

    <h1 className="text-2xl font-bold text-white">Data Management</h1>
    <GlassCard className="p-6 space-y-4">
      <div><h2 className="text-base font-semibold text-slate-200 mb-1">Export Backup</h2><p className="text-sm text-slate-400 mb-3">Download all your data as a JSON file.</p><GradientButton><Icons.Download className="w-4 h-4"/>Download Backup JSON</GradientButton></div>

// ── App Shell ─────────────────────────────────────────────────────────────
const VIEWS = {dashboard:DashboardView,logger:LoggerView,fooddb:FoodDBView,reports:ReportsView,weight:WeightView,profile:ProfileView,planner:PlannerView,data:DataView,settings:SettingsView};

function App() {
  const [activeView,setActiveView]=useState('dashboard');
  const [date,setDate]=useState('2026-03-25');
  const [sidebarOpen,setSidebarOpen]=useState(false);
  const ActiveView=VIEWS[activeView]||DashboardView;
  const showDate=['dashboard','logger'].includes(activeView);

  return <div className="flex h-screen bg-slate-900 overflow-hidden">
    {/* Desktop sidebar */}
    <div className="hidden md:flex"><Sidebar activeView={activeView} setActiveView={(v)=>{setActiveView(v);setSidebarOpen(false);}}/></div>
    {/* Mobile sidebar */}
    {sidebarOpen&&<div className="fixed inset-0 z-40 md:hidden">
      <div className="absolute inset-0 bg-black/50" onClick={()=>setSidebarOpen(false)}/>
      <div className="relative w-56 h-full"><Sidebar activeView={activeView} setActiveView={(v)=>{setActiveView(v);setSidebarOpen(false);}}/></div>
    </div>}
    {/* Main */}
    <div className="flex-1 flex flex-col overflow-hidden">
      {/* TopBar */}
      <header className="h-14 flex items-center justify-between px-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-sm shrink-0">
        <div className="flex items-center gap-3">
          <button onClick={()=>setSidebarOpen(true)} className="md:hidden text-slate-400 hover:text-slate-200"><Icons.Menu className="w-5 h-5"/></button>
          {showDate&&<div className="flex items-center gap-1">
            <button onClick={()=>{const d=new Date(date);d.setDate(d.getDate()-1);setDate(d.toISOString().split('T')[0]);}} className="p-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition-all"><Icons.ChevronLeft className="w-4 h-4"/></button>
            <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-800 rounded-lg">
              <Icons.Calendar className="w-4 h-4 text-emerald-400"/>
              <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="bg-transparent text-sm text-slate-200 focus:outline-none cursor-pointer"/>
            </div>
            <button onClick={()=>{const d=new Date(date);d.setDate(d.getDate()+1);setDate(d.toISOString().split('T')[0]);}} className="p-1.5 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition-all"><Icons.ChevronRight className="w-4 h-4"/></button>
          </div>}
        </div>
        <div className="flex items-center gap-3">
          {showDate&&<span className="hidden md:block text-sm text-slate-400">{new Date(date+'T00:00:00Z').toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric',timeZone:'UTC'})}</span>}
          <span className="text-xs bg-gradient-to-r from-emerald-500 to-cyan-500 text-white px-2.5 py-1 rounded-full font-medium">Demo Mode</span>
        </div>
      </header>
      <main className="flex-1 overflow-y-auto"><ActiveView/></main>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
